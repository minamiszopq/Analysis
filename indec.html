<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>対人分析プロフィール</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState } = React;

const balanceItems = [
  { id: "concrete_abstract", category: "認知", left: "具体", right: "抽象" },
  { id: "optimism_pessimism", category: "認知", left: "楽観", right: "悲観" },
  { id: "emotion_logic", category: "欲求", left: "感情", right: "理屈" },
  { id: "stimulus_safety", category: "欲求", left: "刺激", right: "安心" },
  { id: "dominance", category: "対人関係", left: "支配", right: "被支配" },
  { id: "dependence", category: "対人関係", left: "依存", right: "自立" },
  { id: "goal_avoid", category: "動機", left: "目的志向", right: "問題回避" },
  { id: "real_ideal", category: "動機", left: "現実", right: "理想" },
  { id: "freedom", category: "適正環境", left: "自由", right: "不自由" },
];

const matrixGroups = [
  { id: "desire_matrix", category: "欲求", title: "所属意識 × 承認欲求", xLabel: "所属意識", yLabel: "承認欲求" },
  { id: "interpersonal_matrix", category: "対人関係", title: "積極性 × 孤独耐性", xLabel: "積極性", yLabel: "孤独耐性" },
];

const categoryColors = {
  認知: "#5B6B73",
  欲求: "#8B5E4A",
  対人関係: "#3D4F5C",
  動機: "#6B5B4A",
  適正環境: "#4A6B5E",
};

function BalanceSlider({ item, value, onChange }) {
  const color = categoryColors[item.category];
  return (
    <div className="balance-row">
      <div className="balance-labels">
        <span className="balance-label" style={{ color, fontWeight: value <= 50 ? 700 : 400, opacity: value <= 50 ? 1 : 0.5 }}>
          {item.left}
        </span>
        <span className="balance-ratio">{100 - value} : {value}</span>
        <span className="balance-label" style={{ color, fontWeight: value > 50 ? 700 : 400, opacity: value > 50 ? 1 : 0.5 }}>
          {item.right}
        </span>
      </div>
      <div className="balance-track-wrap">
        <input
          type="range"
          min="0"
          max="100"
          value={value}
          onChange={(e) => onChange(item.id, Number(e.target.value))}
          className="balance-slider"
          style={{ "--track-color": color }}
        />
      </div>
    </div>
  );
}

function MatrixPad({ group, x, y, onChange }) {
  const color = categoryColors[group.category];
  const size = 220;
  const px = (x / 100) * size;
  const py = size - (y / 100) * size;

  const handlePad = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const nx = Math.min(100, Math.max(0, ((e.clientX - rect.left) / rect.width) * 100));
    const ny = Math.min(100, Math.max(0, 100 - ((e.clientY - rect.top) / rect.height) * 100));
    onChange(group.id, Math.round(nx), Math.round(ny));
  };

  return (
    <div className="matrix-block">
      <div className="matrix-title" style={{ color }}>{group.title}</div>
      <div className="matrix-area">
        <div className="matrix-ylabel">{group.yLabel} 強</div>
        <div
          className="matrix-pad"
          style={{ width: size, height: size, borderColor: color + "55" }}
          onMouseDown={(e) => {
            handlePad(e);
            const move = (ev) => handlePad(ev);
            const up = () => {
              window.removeEventListener("mousemove", move);
              window.removeEventListener("mouseup", up);
            };
            window.addEventListener("mousemove", move);
            window.addEventListener("mouseup", up);
          }}
        >
          <div className="matrix-gridline matrix-gridline-h" />
          <div className="matrix-gridline matrix-gridline-v" />
          <div className="matrix-dot" style={{ left: px, top: py, background: color, boxShadow: `0 0 0 4px ${color}22` }} />
        </div>
        <div className="matrix-ylabel matrix-ylabel-bottom">{group.yLabel} 弱</div>
      </div>
      <div className="matrix-xlabels">
        <span>{group.xLabel} 弱</span>
        <span>{group.xLabel} 強</span>
      </div>
      <div className="matrix-readout" style={{ color }}>
        {group.xLabel} {x} ／ {group.yLabel} {y}
      </div>
    </div>
  );
}

function InterpersonalProfile() {
  const [balances, setBalances] = useState(Object.fromEntries(balanceItems.map((i) => [i.id, 50])));
  const [matrices, setMatrices] = useState(Object.fromEntries(matrixGroups.map((g) => [g.id, { x: 50, y: 50 }])));

  const updateBalance = (id, value) => setBalances((prev) => ({ ...prev, [id]: value }));
  const updateMatrix = (id, x, y) => setMatrices((prev) => ({ ...prev, [id]: { x, y } }));

  const categories = ["認知", "欲求", "対人関係", "動機", "適正環境"];

  return (
    <div className="profile-root">
      <div className="profile-header">
        <h1>対人分析プロフィール</h1>
        <p>各項目のスライダーとパッドを操作して、自分自身、または分析したい人物のプロフィールを組み立てます。二極項目は左右の優位度を割合で、2軸項目は座標の位置で表します。</p>
      </div>

      {categories.map((cat) => {
        const items = balanceItems.filter((i) => i.category === cat);
        const groups = matrixGroups.filter((g) => g.category === cat);
        if (items.length === 0 && groups.length === 0) return null;
        return (
          <div className="category-section" key={cat}>
            <div className="category-title" style={{ color: categoryColors[cat] }}>
              <span className="category-dot" style={{ background: categoryColors[cat] }} />
              {cat}
            </div>
            {items.map((item) => (
              <BalanceSlider key={item.id} item={item} value={balances[item.id]} onChange={updateBalance} />
            ))}
            {groups.length > 0 && (
              <div className="matrix-grid-wrap">
                {groups.map((g) => (
                  <MatrixPad key={g.id} group={g} x={matrices[g.id].x} y={matrices[g.id].y} onChange={updateMatrix} />
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<InterpersonalProfile />);
</script>

<style>
  .profile-root {
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
    background: #FAF8F4;
    color: #2A2826;
    min-height: 100vh;
    padding: 48px 24px 80px;
    box-sizing: border-box;
  }
  .profile-header { max-width: 780px; margin: 0 auto 56px; }
  .profile-header h1 { font-size: 28px; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 8px; }
  .profile-header p { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13px; color: #6B655E; margin: 0; line-height: 1.7; }
  .category-section { max-width: 780px; margin: 0 auto 48px; border-top: 1px solid #E4DED2; padding-top: 24px; }
  .category-title { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12px; letter-spacing: 0.15em; margin: 0 0 20px; display: flex; align-items: center; gap: 10px; }
  .category-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .balance-row { margin-bottom: 22px; }
  .balance-labels { display: flex; justify-content: space-between; align-items: baseline; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; margin-bottom: 6px; }
  .balance-label { min-width: 64px; transition: opacity 0.2s, font-weight 0.2s; }
  .balance-label:last-child { text-align: right; }
  .balance-ratio { font-size: 12px; color: #948C80; font-variant-numeric: tabular-nums; }
  .balance-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 2px; background: #E4DED2; outline: none; margin: 0; }
  .balance-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--track-color); cursor: pointer; border: 2px solid #FAF8F4; box-shadow: 0 0 0 1px var(--track-color); }
  .balance-slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--track-color); cursor: pointer; border: 2px solid #FAF8F4; box-shadow: 0 0 0 1px var(--track-color); }
  .matrix-grid-wrap { display: flex; gap: 48px; flex-wrap: wrap; }
  .matrix-block { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .matrix-title { font-size: 14px; margin-bottom: 14px; font-weight: 600; }
  .matrix-area { display: flex; flex-direction: column; align-items: center; }
  .matrix-ylabel { font-size: 11px; color: #948C80; margin: 0 0 6px; }
  .matrix-ylabel-bottom { margin: 6px 0 0; }
  .matrix-pad { position: relative; border: 1px solid; background: #FFFDF9; cursor: crosshair; border-radius: 4px; }
  .matrix-gridline { position: absolute; background: #E4DED2; }
  .matrix-gridline-h { left: 0; right: 0; top: 50%; height: 1px; }
  .matrix-gridline-v { top: 0; bottom: 0; left: 50%; width: 1px; }
  .matrix-dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); transition: left 0.05s, top 0.05s; }
  .matrix-xlabels { display: flex; justify-content: space-between; width: 220px; font-size: 11px; color: #948C80; margin-top: 4px; }
  .matrix-readout { font-size: 12px; margin-top: 10px; font-weight: 600; }
</style>
</body>
</html>
